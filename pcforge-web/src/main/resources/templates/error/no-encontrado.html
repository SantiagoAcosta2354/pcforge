<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('No encontrado')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="display-4 fw-bold text-secondary">404</div>
            <h1 class="h4 fw-bold mt-3">No encontramos lo que buscaba</h1>
            <p class="text-muted" th:text="${mensaje}">El recurso solicitado no existe.</p>
            <p class="text-muted small">
                Puede que el elemento se haya eliminado o que el enlace ya no sea valido.
            </p>
            <a class="btn btn-primary mt-2" th:href="@{/catalogo}">Volver al catalogo</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
