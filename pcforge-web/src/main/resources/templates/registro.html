<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-1">Crear una cuenta</h1>
                    <p class="text-muted small mb-4">
                        La cuenta se crea con perfil de <span class="fw-semibold">cliente</span>.
                        Los demas perfiles los asigna el administrador de la tienda.
                    </p>

                    <form th:action="@{/registro}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label" for="fullName">Nombre completo</label>
                            <input class="form-control" id="fullName" name="fullName" type="text"
                                   maxlength="120" required autofocus/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Correo electronico</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   maxlength="160" required/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="password">Contrasena</label>
                                <input class="form-control" id="password" name="password" type="password"
                                       minlength="8" required/>
                                <div class="form-text">Minimo 8 caracteres.</div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label" for="passwordConfirm">Repita la contrasena</label>
                                <input class="form-control" id="passwordConfirm" name="passwordConfirm"
                                       type="password" minlength="8" required/>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
                    </form>

                    <p class="small text-muted mt-4 mb-0">
                        Ya tiene cuenta? <a th:href="@{/login}">Inicie sesion</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
