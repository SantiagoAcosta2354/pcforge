spring.application.name=pcforge-web

# --- Servidor ---
server.port=${PORT:8080}

# --- Direccion de los microservicios ---
# En Render cada uno tiene su propia URL; en local, el puerto de cada servicio.
pcforge.usuarios.base-url=${PCFORGE_USUARIOS_URL:http://localhost:8081}
pcforge.catalogo.base-url=${PCFORGE_CATALOGO_URL:http://localhost:8082}
pcforge.compatibilidad.base-url=${PCFORGE_COMPATIBILIDAD_URL:http://localhost:8083}
pcforge.pedidos.base-url=${PCFORGE_PEDIDOS_URL:http://localhost:8084}
# El plan gratuito de Render suspende los servicios inactivos, asi que la
# primera peticion puede tardar. Se deja un margen amplio a proposito.
pcforge.downstream.timeout-ms=${PCFORGE_DOWNSTREAM_TIMEOUT_MS:60000}

# --- Sesion ---
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Plantillas ---
spring.thymeleaf.cache=${PCFORGE_THYMELEAF_CACHE:true}

# --- Manejo de errores: sin trazas en pantalla ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=pcforge-web
info.app.description=Capa de presentacion web - PCForge

logging.level.com.pcforge.web=INFO
