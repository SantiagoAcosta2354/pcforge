spring.application.name=pcforge-pedidos

# --- Servidor ---
server.port=${PORT:8084}

# --- MongoDB (base propia de este microservicio) ---
spring.mongodb.uri=${PCFORGE_MONGO_URI:mongodb://localhost:27017/pcforge_pedidos}
pcforge.indexes.enabled=true

# --- Seguridad: valida el token emitido por el microservicio de usuarios ---
pcforge.security.jwt.secret=${PCFORGE_JWT_SECRET:pcforge-clave-de-desarrollo-cambiar-en-produccion-2026}

# --- Microservicios con los que se integra ---
pcforge.catalogo.base-url=${PCFORGE_CATALOGO_URL:http://localhost:8082}
pcforge.compatibilidad.base-url=${PCFORGE_COMPATIBILIDAD_URL:http://localhost:8083}
pcforge.downstream.timeout-ms=${PCFORGE_DOWNSTREAM_TIMEOUT_MS:6000}

# --- Numeracion de pedidos ---
pcforge.orders.number-prefix=${PCFORGE_ORDER_PREFIX:PF}

# --- Documentacion de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=pcforge-pedidos
info.app.description=Cotizaciones, pedidos y ensamblaje - PCForge

logging.level.com.pcforge.pedidos=INFO
