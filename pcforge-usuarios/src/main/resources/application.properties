spring.application.name=pcforge-usuarios

# --- Servidor ---
# En Render el puerto llega en la variable PORT; en local se usa 8081.
server.port=${PORT:8081}

# --- MongoDB (base propia de este microservicio) ---
# En Spring Boot 4 la propiedad es spring.mongodb.uri.
spring.mongodb.uri=${PCFORGE_MONGO_URI:mongodb://localhost:27017/pcforge_usuarios}
pcforge.indexes.enabled=true

# --- Emision y validacion de tokens ---
# Este es el unico servicio que firma tokens; los demas solo los validan
# con el mismo secreto. Minimo 32 caracteres.
pcforge.security.jwt.secret=${PCFORGE_JWT_SECRET:pcforge-clave-de-desarrollo-cambiar-en-produccion-2026}
pcforge.security.jwt.issuer=pcforge-usuarios
pcforge.security.jwt.expiration-minutes=${PCFORGE_JWT_EXPIRATION_MINUTES:480}

# Usuario administrador creado al iniciar, solo si no existe ninguno
pcforge.seed.enabled=${PCFORGE_SEED_ENABLED:true}
pcforge.seed.admin-email=${PCFORGE_ADMIN_EMAIL:admin@pcforge.co}
pcforge.seed.admin-password=${PCFORGE_ADMIN_PASSWORD:Admin1234*}
# Contrasena de las cuentas de demostracion asesor, tecnico y cliente
pcforge.seed.demo-password=${PCFORGE_DEMO_PASSWORD:Demo1234*}

# --- Documentacion de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=pcforge-usuarios
info.app.description=Microservicio de usuarios y autenticacion - PCForge

logging.level.com.pcforge.usuarios=INFO
