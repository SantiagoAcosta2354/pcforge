spring.application.name=pcforge-catalogo

# --- Servidor ---
# En Render el puerto llega en la variable PORT; en local se usa 8082.
server.port=${PORT:8082}

# --- MongoDB (una base logica por microservicio: database-per-service) ---
# OJO: en Spring Boot 4 la propiedad es spring.mongodb.uri. La antigua
# spring.data.mongodb.uri quedo obsoleta con nivel error desde la version 4.0.0.
spring.mongodb.uri=${PCFORGE_MONGO_URI:mongodb://localhost:27017/pcforge_catalogo}

# Los indices se crean de forma explicita en MongoIndexConfig
pcforge.indexes.enabled=true

# --- Seguridad: valida el token JWT firmado por el microservicio de usuarios ---
# El mismo secreto debe estar en los demas servicios y en la capa web.
pcforge.security.jwt.secret=${PCFORGE_JWT_SECRET:pcforge-clave-de-desarrollo-cambiar-en-produccion-2026}

# --- Documentacion de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Observabilidad para el despliegue ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=pcforge-catalogo
info.app.description=Microservicio de catalogo e inventario - PCForge

# --- Datos semilla para demostracion ---
pcforge.seed.enabled=${PCFORGE_SEED_ENABLED:true}

# --- Logs ---
logging.level.com.pcforge.catalogo=INFO
