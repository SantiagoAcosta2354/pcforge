spring.application.name=pcforge-compatibilidad

# --- Servidor ---
server.port=${PORT:8083}

# --- MongoDB (base propia de este microservicio) ---
spring.mongodb.uri=${PCFORGE_MONGO_URI:mongodb://localhost:27017/pcforge_compatibilidad}
pcforge.indexes.enabled=true

# --- Seguridad: valida el token emitido por el microservicio de usuarios ---
pcforge.security.jwt.secret=${PCFORGE_JWT_SECRET:pcforge-clave-de-desarrollo-cambiar-en-produccion-2026}

# --- Direccion del microservicio de catalogo ---
# Este servicio NO lee la base del catalogo: le pide los datos por API.
pcforge.catalogo.base-url=${PCFORGE_CATALOGO_URL:http://localhost:8082}
pcforge.catalogo.timeout-ms=${PCFORGE_CATALOGO_TIMEOUT_MS:5000}

# --- Documentacion de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=pcforge-compatibilidad
info.app.description=Configurador y validacion de compatibilidad - PCForge

# --- Reglas de negocio por defecto ---
pcforge.seed.enabled=${PCFORGE_SEED_ENABLED:true}
pcforge.rules.power-margin-percent=${PCFORGE_POWER_MARGIN:20}

logging.level.com.pcforge.compatibilidad=INFO
